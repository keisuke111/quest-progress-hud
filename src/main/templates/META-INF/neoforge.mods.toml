modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/keisuke111/quest-progress-hud/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/quest-progress-hud"
authors="keisuke111"
description='''
A compact client-side HUD for your team's FTB Quests progress.
Track all quests or one chapter, edit the HUD layout, and optionally bind a visibility key.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="ftbquests"
type="required"
versionRange="[2101.1.0,)"
ordering="AFTER"
side="CLIENT"
