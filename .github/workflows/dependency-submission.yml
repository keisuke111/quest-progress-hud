name: Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - '**/*.gradle'
      - 'gradle.properties'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-submission:
    if: github.repository == 'keisuke111/quest-progress-hud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '9.2.1'
          cache-provider: basic
          dependency-graph: generate-and-submit
          additional-arguments: --no-configuration-cache --stacktrace
      - name: Report dependency provenance
        run: gradle buildEnvironment dependencies --console=plain > dependency-provenance.txt
      - name: Preserve dependency audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: |
            dependency-provenance.txt
            dependency-graph-reports/*.json
          retention-days: 14
