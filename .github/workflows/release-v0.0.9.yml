name: Publish v0.0.9 beta

on:
  push:
    branches: [main]
    paths: ['releases/v0.0.9.md']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-v0.0.9
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'keisuke111/quest-progress-hud'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout publication notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify unchanged tested source and successful build
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 07324afaee7484cc3e56f599cafd0cb44c46df3d "$GITHUB_SHA" -- src build.gradle gradle.properties .github/workflows/build.yml
          build_ok=$(gh api "repos/$GH_REPO/actions/runs/37643319088" --jq '.head_sha == "07324afaee7484cc3e56f599cafd0cb44c46df3d" and .conclusion == "success"')
          test "$build_ok" = true
          if git rev-parse --verify refs/tags/v0.0.9 >/dev/null 2>&1; then
            echo '::error::v0.0.9 tag already exists. Inspect it before attempting another publication.'
            exit 1
          fi

      - name: Download and verify the playtested jar
        shell: bash
        run: |
          set -euo pipefail
          gh run download 37643319088 --name quest-progress-hud --dir dist
          echo '59e58c6da12ac44999972371c151dcd6990e5ca6fc0ec8c831ef48aab24dfe42  dist/quest-progress-hud-0.0.9.jar' | sha256sum --check --strict

      - name: Stage beta release with the verified jar
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.0.9 >/dev/null 2>&1; then
            echo '::error::v0.0.9 already exists. Inspect it before attempting another publication.'
            exit 1
          fi
          gh release create v0.0.9 dist/quest-progress-hud-0.0.9.jar \
            --target "$GITHUB_SHA" --title 'Quest Progress HUD v0.0.9 (Beta)' \
            --notes-file releases/v0.0.9.md --prerelease --draft

      - name: Verify uploaded asset and publish beta
        shell: bash
        run: |
          set -euo pipefail
          digest=$(gh api "repos/$GH_REPO/releases/tags/v0.0.9" --jq '.assets[] | select(.name == "quest-progress-hud-0.0.9.jar") | .digest')
          test "$digest" = 'sha256:59e58c6da12ac44999972371c151dcd6990e5ca6fc0ec8c831ef48aab24dfe42'
          gh release edit v0.0.9 --draft=false --prerelease --latest=false
          gh release view v0.0.9 --json url,isDraft,isPrerelease
