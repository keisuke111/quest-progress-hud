plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    maven {
        url = "https://maven.ftb.dev/releases"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
}

base {
    archivesName = mod_artifact_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly "dev.ftb.mods:ftb-quests-neoforge:2101.1.36"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]

    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// These are standalone Java checks, kept separate from framework-based unit tests.
sourceSets {
    layoutCheck {
        java.srcDir 'src/layoutCheck/java'
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

// Keep every standalone check on the same classpath and wired into gradle build.
var hudChecks = [
        verifyHudLayout: ['HudLayoutTest', 'Check HUD corners, offsets, scale, bounds, and opacity.'],
        verifyProgress: ['ProgressTrackerTest', 'Check refresh timing, sync readiness, disconnects, teams, resets and counting.'],
        verifyHudConfig: ['HudConfigTest', 'Check persisted settings and invalid-value correction using the NeoForge spec.'],
        verifyHudEditor: ['HudEditorStateTest', 'Check isolated edit state, drag bounds, corner offsets, reset and resizing.'],
        verifyQuestScope: ['QuestScopeTest', 'Check default all-quest scope, chapter membership and stable IDs.'],
        verifyHudToggle: ['HudToggleInputTest', 'Check single presses, held-key repeats and input outside gameplay.'],
].collect { taskName, details ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = details[1]
        dependsOn tasks.named('layoutCheckClasses')
        classpath = sourceSets.layoutCheck.runtimeClasspath
        mainClass = "io.github.keisuke111.questprogresshud.${details[0]}"
    }
}

tasks.named('check') {
    dependsOn hudChecks
}
